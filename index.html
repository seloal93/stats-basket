<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Stats - Liga de Amigos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex flex-col sm:flex-row gap-4 justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-red-600 text-white font-black px-3 py-1 rounded text-xl italic tracking-wider">
        NBA
      </div>
      <h1 class="text-xl font-bold tracking-tight">Estadísticas Liga de Amigos</h1>
    </div>

    <!-- Filtros -->
    <div class="flex items-center gap-3">
      <!-- Desplegable Últimas N Fechas/Jornadas -->
      <div class="flex items-center gap-2 text-xs">
        <label for="last-games" class="text-slate-400 font-semibold uppercase">Segmento:</label>
        <select id="last-games" onchange="filterGames(this.value)" class="bg-slate-800 text-white border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500 font-medium">
          <option value="all">Toda la Temporada</option>
          <option value="1">Última Jornada</option>
          <option value="2">Últimas 2 Jornadas</option>
          <option value="3">Últimas 3 Jornadas</option>
          <option value="5">Últimas 5 Jornadas</option>
          <option value="10">Últimas 10 Jornadas</option>
        </select>
      </div>

      <!-- Selector Promedios / Totales -->
      <div class="flex bg-slate-800 p-1 rounded-lg text-xs font-semibold">
        <button id="btn-avg" onclick="setMode('avg')" class="px-3 py-1.5 rounded-md bg-blue-600 text-white transition">Promedios</button>
        <button id="btn-tot" onclick="setMode('tot')" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white transition">Totales</button>
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <main class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold text-white">Líderes de la Liga</h2>
      <span class="text-xs text-slate-400">* Haz clic en los encabezados para ordenar</span>
    </div>

    <div id="loading" class="text-center py-16 text-slate-400 font-medium">Cargando datos del Sheet...</div>

    <div id="table-container" class="hidden overflow-x-auto rounded-lg border border-slate-800 bg-slate-900 shadow-xl">
      <table class="w-full text-sm text-left text-slate-300">
        <thead class="text-xs uppercase bg-slate-800/90 text-slate-400 border-b border-slate-700 cursor-pointer select-none">
          <tr>
            <th class="px-3 py-3 w-10">#</th>
            <th onclick="sortBy('player')" class="px-4 py-3 font-semibold text-white hover:text-blue-400">JUGADOR</th>
            <th onclick="sortBy('gp')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">GP</th>
            <th onclick="sortBy('pts')" class="px-3 py-3 text-right font-semibold text-amber-400 hover:text-yellow-300">PTS</th>
            <th onclick="sortBy('fgm')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">FGM</th>
            <th onclick="sortBy('fga')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">FGA</th>
            <th onclick="sortBy('fg_pct')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">FG%</th>
            <th onclick="sortBy('t3m')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">3PM</th>
            <th onclick="sortBy('t3a')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">3PA</th>
            <th onclick="sortBy('t3_pct')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">3P%</th>
            <th onclick="sortBy('rbo')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">OREB</th>
            <th onclick="sortBy('rbt')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">REB</th>
            <th onclick="sortBy('ast')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">AST</th>
            <th onclick="sortBy('blk')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">BLK</th>
            <th onclick="sortBy('stl')" class="px-3 py-3 text-right font-semibold hover:text-blue-400">STL</th>
            <th onclick="sortBy('to')" class="px-3 py-3 text-right font-semibold text-rose-400 hover:text-rose-300">TO</th>
            <th onclick="sortBy('eff')" class="px-3 py-3 text-right font-semibold text-emerald-400 hover:text-emerald-300">EFF</th>
          </tr>
        </thead>
        <tbody id="stats-body" class="divide-y divide-slate-800">
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const API_URL = 'https://sheetdb.io/api/v1/qvxszq0qirsq0';
    let rawData = [];
    let processedPlayers = [];
    let currentSort = 'pts';
    let sortAsc = false;
    let displayMode = 'avg';
    let lastGamesLimit = 'all';

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        rawData = data;
        processData();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('table-container').classList.remove('hidden');
        renderTable();
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Error al cargar las estadísticas.';
        console.error(err);
      });

    function processData() {
      // 1. Obtener todas las fechas únicas y ordenarlas cronológicamente
      const allDates = Array.from(new Set(
        rawData.map(r => (r.date || '').trim()).filter(Boolean)
      )).sort();

      // 2. Determinar qué fechas entran según el filtro
      let allowedDates = new Set(allDates);
      if (lastGamesLimit !== 'all' && allDates.length > 0) {
        const limit = parseInt(lastGamesLimit);
        const targetDates = allDates.slice(-limit); // Coge las últimas N fechas únicas
        allowedDates = new Set(targetDates);
      }

      // 3. Filtrar los registros que coinciden con las fechas seleccionadas
      const filteredData = rawData.filter(r => allowedDates.has((r.date || '').trim()));

      // 4. Agrupar por jugador
      const playersMap = {};

      filteredData.forEach(row => {
        const name = (row.player || '').trim();
        if (!name) return;

        if (!playersMap[name]) {
          playersMap[name] = { player: name, gp: 0, fgm: 0, fga: 0, t3m: 0, t3a: 0, rbo: 0, rbt: 0, ast: 0, blk: 0, stl: 0, to: 0 };
        }

        const p = playersMap[name];
        p.gp += 1;
        p.fgm += parseFloat(row.fgm) || 0;
        p.fga += parseFloat(row.fga) || 0;
        p.t3m += parseFloat(row.t3m) || 0;
        p.t3a += parseFloat(row.t3a) || 0;
        p.rbo += parseFloat(row.rbo) || 0;
        p.rbt += parseFloat(row.rbt) || 0;
        p.ast += parseFloat(row.ast) || 0;
        p.blk += parseFloat(row.blk) || 0;
        p.stl += parseFloat(row.stl) || 0;
        p.to  += parseFloat(row.to)  || 0;
      });

      // 5. Calcular totales, eficiencias y porcentajes
      processedPlayers = Object.values(playersMap).map(p => {
        const pts = ((p.fgm - p.t3m) * 2) + (p.t3m * 3);
        const missedFg = p.fga - p.fgm;
        const eff = (pts + p.rbt + p.ast + p.stl + p.blk) - (missedFg + p.to);
        const fg_pct = p.fga > 0 ? (p.fgm / p.fga) * 100 : 0;
        const t3_pct = p.t3a > 0 ? (p.t3m / p.t3a) * 100 : 0;

        return { ...p, pts, eff, fg_pct, t3_pct };
      });
    }

    function filterGames(value) {
      lastGamesLimit = value;
      processData();
      renderTable();
    }

    function setMode(mode) {
      displayMode = mode;
      document.getElementById('btn-avg').className = mode === 'avg' ? "px-3 py-1.5 rounded-md bg-blue-600 text-white transition" : "px-3 py-1.5 rounded-md text-slate-400 hover:text-white transition";
      document.getElementById('btn-tot').className = mode === 'tot' ? "px-3 py-1.5 rounded-md bg-blue-600 text-white transition" : "px-3 py-1.5 rounded-md text-slate-400 hover:text-white transition";
      renderTable();
    }

    function sortBy(key) {
      if (currentSort === key) {
        sortAsc = !sortAsc;
      } else {
        currentSort = key;
        sortAsc = false;
      }
      renderTable();
    }

    function renderTable() {
      processedPlayers.sort((a, b) => {
        let valA = a[currentSort];
        let valB = b[currentSort];
        if (displayMode === 'avg' && !['player', 'gp', 'fg_pct', 't3_pct'].includes(currentSort)) {
          valA = valA / a.gp;
          valB = valB / b.gp;
        }
        if (typeof valA === 'string') return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        return sortAsc ? valA - valB : valB - valA;
      });

      const tbody = document.getElementById('stats-body');
      tbody.innerHTML = '';

      processedPlayers.forEach((p, index) => {
        const isAvg = displayMode === 'avg';
        const fmt = (val) => isAvg ? (val / p.gp).toFixed(1) : val.toFixed(0);

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-800/60 transition";
        tr.innerHTML = `
          <td class="px-3 py-3 text-slate-500 text-xs">${index + 1}</td>
          <td class="px-4 py-3 font-medium text-white">${p.player}</td>
          <td class="px-3 py-3 text-right font-semibold text-slate-300">${p.gp}</td>
          <td class="px-3 py-3 text-right font-bold text-amber-400">${fmt(p.pts)}</td>
          <td class="px-3 py-3 text-right">${fmt(p.fgm)}</td>
          <td class="px-3 py-3 text-right">${fmt(p.fga)}</td>
          <td class="px-3 py-3 text-right text-slate-300">${p.fg_pct.toFixed(1)}%</td>
          <td class="px-3 py-3 text-right">${fmt(p.t3m)}</td>
          <td class="px-3 py-3 text-right">${fmt(p.t3a)}</td>
          <td class="px-3 py-3 text-right text-slate-300">${p.t3_pct.toFixed(1)}%</td>
          <td class="px-3 py-3 text-right">${fmt(p.rbo)}</td>
          <td class="px-3 py-3 text-right">${fmt(p.rbt)}</td>
          <td class="px-3 py-3 text-right">${fmt(p.ast)}</td>
          <td class="px-3 py-3 text-right">${fmt(p.blk)}</td>
          <td class="px-3 py-3 text-right">${fmt(p.stl)}</td>
          <td class="px-3 py-3 text-right text-rose-400">${fmt(p.to)}</td>
          <td class="px-3 py-3 text-right font-bold text-emerald-400">${fmt(p.eff)}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
